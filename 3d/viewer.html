<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Makeshift Flipper 3D</title>
<style>
  :root { --bg:#0e1016; --panel:#171a22; --fg:#e9ecf3; --dim:#9298a6; --accent:#4ea3ff; --line:#282d39; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font:14px/1.5 -apple-system,system-ui,"Segoe UI",sans-serif; overflow:hidden; -webkit-user-select:none; user-select:none; }
  #c { position:fixed; inset:0; display:block; }
  .panel { position:fixed; background:rgba(23,26,34,.92); border:1px solid var(--line);
    border-radius:13px; backdrop-filter:blur(8px); box-shadow:0 10px 36px rgba(0,0,0,.45); }
  #hud { left:16px; top:16px; padding:16px 18px; width:264px; }
  #hud h1 { font-size:16px; margin:0; letter-spacing:.3px; }
  #hud .sub { color:var(--dim); font-size:12px; margin:2px 0 14px; }
  .seg { display:flex; background:#11141b; border:1px solid var(--line); border-radius:9px; padding:3px; margin-bottom:10px; }
  .seg button { flex:1; background:transparent; color:var(--dim); border:0; border-radius:6px;
    padding:8px 6px; font-size:13px; cursor:pointer; transition:.15s; }
  .seg button.on { background:var(--accent); color:#06121f; font-weight:600; }
  .slider { margin:4px 0 12px; }
  .slider label { display:flex; justify-content:space-between; color:var(--dim); font-size:12px; margin-bottom:5px; }
  input[type=range] { width:100%; accent-color:var(--accent); }
  button.wide { width:100%; background:#232733; color:var(--fg); border:1px solid var(--line);
    border-radius:8px; padding:9px; font-size:13px; cursor:pointer; margin-bottom:10px; transition:.15s; }
  button.wide:hover { border-color:var(--accent); }
  label.chk { display:flex; align-items:center; gap:8px; color:var(--dim); font-size:13px; cursor:pointer; padding:3px 0; }
  label.chk input { accent-color:var(--accent); }
  .hint { color:var(--dim); font-size:11px; margin-top:11px; border-top:1px solid var(--line); padding-top:10px; }
  #legend { right:16px; top:16px; padding:14px 16px; width:224px; max-height:88vh; overflow:auto; }
  #legend h2 { font-size:11px; text-transform:uppercase; letter-spacing:1.2px; color:var(--dim); margin:0 0 10px; }
  .leg { display:flex; align-items:center; gap:9px; font-size:12px; margin-bottom:7px; cursor:default; }
  .leg .sw { width:13px; height:13px; border-radius:3px; flex:none; }
  .leg small { color:var(--dim); margin-left:auto; }
  #tip { position:fixed; pointer-events:none; background:#04060b; border:1px solid var(--accent);
    color:#fff; padding:7px 11px; border-radius:8px; font-size:12px; display:none; z-index:20;
    box-shadow:0 6px 20px rgba(0,0,0,.55); max-width:250px; }
  #tip b { color:var(--accent); display:block; margin-bottom:2px; }
  #tip span { color:#b9c2cf; }
  #load { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:var(--bg); color:var(--dim); font-size:14px; z-index:30; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="load">3D sahne yükleniyor…</div>
<div id="hud" class="panel">
  <h1>Makeshift Flipper</h1>
  <div class="sub">ESP32-C6 · gerçek BOM · interaktif 3D</div>
  <div class="seg">
    <button id="mAsm" class="on">Montajlı</button>
    <button id="mExp">Patlatılmış</button>
    <button id="mCase">Kasasız</button>
  </div>
  <div class="slider">
    <label><span>Patlatma</span><span id="exV">0%</span></label>
    <input type="range" id="exR" min="0" max="100" value="0">
  </div>
  <button class="wide" id="bSpin">Otomatik döndür: açık</button>
  <label class="chk"><input type="checkbox" id="tCase" checked> Kasa (yarı saydam)</label>
  <label class="chk"><input type="checkbox" id="tWire" checked> Kablolar</label>
  <label class="chk"><input type="checkbox" id="tLabel" checked> Etiketler</label>
  <label class="chk"><input type="checkbox" id="tExport"> (indir: .glb Blender için)</label>
  <div class="hint">Sürükle döndür · tekerlek yakınlaştır · sağ tık kaydır. Parça üstüne gel → pin bilgisi.</div>
</div>
<div id="legend" class="panel">
  <h2>Gerçek parça listesi</h2>
</div>
<div id="tip"></div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";
import { GLTFExporter } from "three/addons/exporters/GLTFExporter.js";

// Coordinate convention: author in mm with x=right, y=depth(into screen), z=up,
// then map to three.js (y-up) as (x, z, -y). Real dimensions from vendor specs
// (RC522 60x40, RDM6300 PCB 38.5x19 + coil 46x33, LCD 52x26.5, TP4056 Type-C
// 28x17, MT3608 37x17x14, motor 6x14mm). Pin positions are schematic.
const P = (x, y, z) => new THREE.Vector3(x, z, -y);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0e1016);
scene.fog = new THREE.Fog(0x0e1016, 520, 1400);
const root = new THREE.Group(); scene.add(root); // everything that explodes

const cam = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 1, 5000);
cam.position.set(95, 115, 180);
const ren = new THREE.WebGLRenderer({ canvas: document.getElementById("c"), antialias: true });
ren.setPixelRatio(Math.min(devicePixelRatio, 2));
ren.setSize(innerWidth, innerHeight);
ren.shadowMap.enabled = true; ren.shadowMap.type = THREE.PCFSoftShadowMap;
ren.toneMapping = THREE.ACESFilmicToneMapping; ren.toneMappingExposure = 1.05;

const ctl = new OrbitControls(cam, ren.domElement);
ctl.enableDamping = true; ctl.target.set(0, 4, 0);
ctl.minDistance = 70; ctl.maxDistance = 650;

scene.add(new THREE.HemisphereLight(0xdbe8ff, 0x1a1c24, 0.85));
const key = new THREE.DirectionalLight(0xffffff, 2.4);
key.position.set(110, 240, 150); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { near: 40, far: 900, left: -180, right: 180, top: 180, bottom: -180 });
key.shadow.bias = -0.0004; scene.add(key);
const rim = new THREE.DirectionalLight(0x5c8cff, 0.7); rim.position.set(-140, 70, -130); scene.add(rim);
const fillL = new THREE.DirectionalLight(0xffe0b0, 0.35); fillL.position.set(60, 40, 180); scene.add(fillL);

const ground = new THREE.Mesh(new THREE.CircleGeometry(700, 64),
  new THREE.MeshStandardMaterial({ color: 0x090b10, roughness: 1 }));
ground.rotation.x = -Math.PI / 2; ground.position.y = -46; ground.receiveShadow = true; scene.add(ground);

// ---------- material + primitive helpers ------------------------------------
const mat = (c, r = 0.6, m = 0) => new THREE.MeshStandardMaterial({ color: c, roughness: r, metalness: m });
const C = {
  green:0x11602f, dkgreen:0x0c4524, blue:0x12379e, navy:0x0b1f6b, red:0x9e1717, maroon:0x6a0f12,
  black:0x0f1115, chip:0x1c1f26, silver:0xc4c7cf, alu:0xb7bbc4, gold:0xd9b24a, copper:0xb9742f,
  screen:0x05080f, lipo:0x6f7684, lipo2:0x565c69, white:0xe4e8ef, blueboard:0x1746b8,
  ir:0x3a1016, clear:0x9fb4c6, pcbgold:0xcaa94a, orange:0xd98a2b, teal:0x1b7d8c,
};
const pcbEdge = mat(C.pcbgold, 0.5, 0.25);
function pcbMats(color) { const s = mat(color, 0.58); const b = mat(color, 0.72);
  return [pcbEdge, pcbEdge, s, b, pcbEdge, pcbEdge]; }

// Registry drives both the scene and the legend. Each part: builder adds meshes
// to a per-part THREE.Group `g`; asm/exp are the group's assembled/exploded
// local positions (mm, authored coords); info is the hover tooltip.
const PARTS = [];
function def(o) { PARTS.push(o); return o; }

function box(g, w, d, t, col, x = 0, y = 0, z = 0, round = true) {
  const geo = round ? new RoundedBoxGeometry(w, t, d, 2, Math.min(1, t / 2, w / 3, d / 3))
                    : new THREE.BoxGeometry(w, t, d);
  const m = new THREE.Mesh(geo, Array.isArray(col) ? col : mat(col));
  m.position.copy(P(x, y, z)); m.castShadow = m.receiveShadow = true; g.add(m); return m;
}
function cyl(g, r1, r2, h, col, x = 0, y = 0, z = 0, seg = 28) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r1, r2, h, seg), Array.isArray(col) ? col : mat(col));
  m.position.copy(P(x, y, z)); m.castShadow = m.receiveShadow = true; g.add(m); return m;
}
function torus(g, R, r, col, x = 0, y = 0, z = 0) {
  const m = new THREE.Mesh(new THREE.TorusGeometry(R, r, 10, 44), Array.isArray(col) ? col : mat(col));
  m.position.copy(P(x, y, z)); m.rotation.x = Math.PI / 2; m.castShadow = m.receiveShadow = true; g.add(m); return m;
}
function headerStrip(g, x0, y0, z, n, horizontal = true) {
  const pm = mat(0x0c0c0e, 0.7), gm = mat(C.gold, 0.3, 0.9);
  const len = n * 2.54;
  box(g, horizontal ? len + 1 : 2.4, horizontal ? 2.4 : len + 1, 2.5, pm, x0, y0, z + 1.25);
  for (let i = 0; i < n; i++) {
    const off = -((n - 1) * 2.54) / 2 + i * 2.54;
    const px = x0 + (horizontal ? off : 0), py = y0 + (horizontal ? 0 : off);
    const pin = new THREE.Mesh(new THREE.BoxGeometry(0.6, 5.5, 0.6), gm);
    pin.position.copy(P(px, py, z + 3)); pin.castShadow = true; g.add(pin);
  }
}
function smd(g, x, y, z, w = 1.6, d = 0.9, col = C.chip) { box(g, w, d, 0.6, col, x, y, z, false); }

// =========================== PART BUILDERS ==================================
// Z layering of the sandwich (authored z, mm). Case floor at z≈-16.
const Z = { case:-18, rdm:-12, rc:-10, esp:2, lcd:16, lid:30 };

// --- 1. ESP32-C6-DEV-KIT-NX (54x25mm, ~1.6 PCB) -----------------------------
def({ key:"esp", name:"ESP32-C6-DEV-KIT-NX", qty:1, col:C.green,
  info:{ t:"ESP32-C6-DEV-KIT-NX", d:"Ana MCU · Wi-Fi 6 + BLE 5 · 54×25 mm" },
  asm:[0,0,Z.esp], exp:[0,0,Z.esp],
  build(g) {
    box(g, 54, 25, 1.6, pcbMats(C.green), 0, 0, 0);
    // RF-shielded C6 module + PCB antenna area at one end
    box(g, 16, 13, 2.6, mat(C.silver,0.35,0.9), 13, 0, 1.3);
    box(g, 6, 13, 1.2, mat(C.dkgreen,0.6), 23.5, 0, 0.6); // antenna cutout zone
    // USB-C at the other end, overhanging the edge
    box(g, 9, 7.6, 3.4, mat(C.alu,0.3,0.95), -27, 0, 1.5);
    // dual 1x20-ish headers down both long edges
    headerStrip(g, 0, 11.4, 0.8, 18, true);
    headerStrip(g, 0, -11.4, 0.8, 18, true);
    // a BOOT/RST button pair + a few passives
    box(g, 2.4, 2.4, 1.2, mat(0x202228), -20, 8, 0.6);
    box(g, 2.4, 2.4, 1.2, mat(0x202228), -20, -8, 0.6);
    smd(g,-14,5,0.9); smd(g,-16,5,0.9); smd(g,6,8,0.9); smd(g,9,8,0.9);
  }});

// --- 2. Waveshare Pico-LCD-1.3 (52x26.5mm) ----------------------------------
let screenMat;
def({ key:"lcd", name:"Pico-LCD-1.3 (ekran+joystick)", qty:1, col:C.black,
  info:{ t:"Pico-LCD-1.3", d:"240×240 ST7789 · joystick + A/B/X/Y · 52×26.5 mm" },
  asm:[0,0,Z.lcd], exp:[0,0,Z.lcd+26],
  build(g) {
    box(g, 52, 26.5, 1.6, pcbMats(C.black), 0, 0, 0);
    // display bezel + emissive glass
    box(g, 27.5, 27.5, 1.3, mat(0x080808,0.5), -4, 0, 1.3);
    screenMat = new THREE.MeshStandardMaterial({ roughness:0.22, emissive:0xffffff, emissiveIntensity:1 });
    const sc = new THREE.Mesh(new THREE.PlaneGeometry(23.4, 23.4), screenMat);
    sc.rotation.x = -Math.PI/2; sc.position.copy(P(-4,0,2.0)); g.add(sc);
    sc.userData.info = { t:"Ekran 240×240", d:"Senin menün (koddan çizildi)" };
    hover.push(sc);
    // Pico-LCD-1.3 controls: joystick (right) + 4 tact buttons (A/B/X/Y column)
    cyl(g, 3.2, 4.2, 4.6, mat(0x18181c,0.5), 19, 8, 3.0);     // joystick
    for (const [bx,by,lab] of [[19,-7,"A"],[14,-9,"B"],[24,-9,"X"],[19,-11,"Y"]])
      cyl(g, 1.9, 1.9, 2.2, mat(0x24262e,0.5), bx, by, 2.0, 16);
    headerStrip(g, 0, 12.5, -1.6, 20, true); // underside socket row (points down)
  }});

// --- 3. RC522 (60x40mm, 3.3V) -----------------------------------------------
def({ key:"rc522", name:"RC522 (13.56 MHz NFC)", qty:1, col:C.blue,
  info:{ t:"RC522 / MFRC522", d:"13.56 MHz · SPI 3.3V · SCK/MOSI LCD ile ortak" },
  asm:[-2,-6,Z.rc], exp:[-4,-34,Z.rc-10],
  build(g) {
    box(g, 60, 40, 1.6, pcbMats(C.blueboard), 0, 0, 0);
    // etched antenna loop (rounded rectangle as a thin frame)
    const sh = new THREE.Shape();
    const ow=50, oh=30, iw=42, ih=22, rr=5;
    const rect=(s,w,h,r)=>{ s.moveTo(-w/2+r,-h/2); s.lineTo(w/2-r,-h/2); s.quadraticCurveTo(w/2,-h/2,w/2,-h/2+r);
      s.lineTo(w/2,h/2-r); s.quadraticCurveTo(w/2,h/2,w/2-r,h/2); s.lineTo(-w/2+r,h/2);
      s.quadraticCurveTo(-w/2,h/2,-w/2,h/2-r); s.lineTo(-w/2,-h/2+r); s.quadraticCurveTo(-w/2,-h/2,-w/2+r,-h/2); };
    rect(sh,ow,oh,rr); const hole=new THREE.Path(); rect(hole,iw,ih,rr-1); sh.holes.push(hole);
    const loop=new THREE.Mesh(new THREE.ExtrudeGeometry(sh,{depth:0.4,bevelEnabled:false}),
      mat(C.copper,0.4,0.8));
    loop.rotation.x=-Math.PI/2; loop.position.copy(P(0,-3,0.9)); g.add(loop);
    // MFRC522 chip + crystal + passives near the header
    box(g, 5, 5, 1.1, mat(C.chip,0.5), 20, 13, 0.8);
    box(g, 3.2, 1.8, 1.2, mat(C.silver,0.35,0.8), 14, 13, 0.8);
    for (const x of [-18,-14,-10]) smd(g,x,15,0.8);
    headerStrip(g, -22, 16.5, 0.8, 8, true); // 8-pin SPI header
  }});

// --- 4. RDM6300 PCB (38.5x19mm) + external coil (46x33mm) --------------------
def({ key:"rdm", name:"RDM6300 (125 kHz)", qty:1, col:C.red,
  info:{ t:"RDM6300", d:"125 kHz EM4100 · 5V · TX→IO15 · harici bobin" },
  asm:[-14,10,Z.rc+3], exp:[58,20,Z.rdm-8],
  build(g) {
    box(g, 38.5, 19, 1.6, pcbMats(C.maroon), 0, 0, 0);
    box(g, 5, 5, 1.2, mat(C.chip,0.5), -6, 0, 0.8);          // IC
    box(g, 3.2, 1.8, 1.4, mat(C.silver,0.35,0.8), 2, 3, 0.8); // crystal
    for (const x of [8,11]) smd(g,x,-3,0.8);
    headerStrip(g, 14, 6, 0.8, 4, true);  // TX/RX/VCC/GND
    headerStrip(g, -16, -5, 0.8, 2, true); // antenna 2-pin
  }});
def({ key:"rdmcoil", name:"125 kHz anten bobini", qty:1, col:C.copper,
  info:{ t:"RDM6300 bobini", d:"46×33 mm harici anten (ayrı parça)" },
  asm:[6,-6,Z.case+1], exp:[58,-28,Z.rdm-8],
  build(g) {
    // flat wound rectangular coil
    for (let i=0;i<5;i++){ const s=new THREE.Shape();
      const w=40-i*2.2, h=27-i*2.2;
      s.absarc(0,0,0,0,0); // placeholder
    }
    // simpler: a rounded-rect torus-like frame + a few concentric rings
    for (let i=0;i<4;i++){
      const rr = 15 - i*1.4;
      const ring = new THREE.Mesh(new THREE.TorusGeometry(rr, 0.55, 8, 50), mat(C.copper,0.4,0.85));
      ring.rotation.x=-Math.PI/2; ring.position.copy(P(0,0,0.6)); g.add(ring);
    }
    box(g, 36, 25, 0.25, mat(0x14100a,0.85), 0, 0, -0.2, true); // thin carrier film
  }});

// --- 5. VS1838B IR receiver + IR LED + 2N2222 driver ------------------------
def({ key:"irrx", name:"VS1838B IR alıcı", qty:1, col:C.black,
  info:{ t:"VS1838B", d:"IR alıcı · OUT→GPIO4 · 3.3V" },
  asm:[-30,16,Z.esp+2], exp:[-52,24,Z.esp+2],
  build(g){ cyl(g,3.6,3.6,1.2,mat(0x1a1a1a,0.5),0,0,0.6,20);
    const dome=new THREE.Mesh(new THREE.SphereGeometry(3.4,20,14,0,6.3,0,1.57),mat(0x111,0.35));
    dome.position.copy(P(0,0,1.2)); dome.castShadow=true; g.add(dome);
    for(const lx of [-1.27,0,1.27]){const leg=new THREE.Mesh(new THREE.CylinderGeometry(0.3,0.3,4),mat(C.silver,0.3,0.8));
      leg.position.copy(P(lx,-1.5,-1.5)); g.add(leg);} }});
def({ key:"irled", name:"IR verici (KY-005 modülü / LED)", qty:1, col:C.ir,
  info:{ t:"IR verici (KY-005)", d:"Modül PCB'si modellenmedi (boyut doğrulanmadı), sadece LED gösteriliyor · GPIO0→1k→2N2222→LED" },
  asm:[-30,6,Z.esp+2], exp:[-52,8,Z.esp+2],
  build(g){ cyl(g,2.55,2.55,5,mat(0x3a1218,0.18),0,0,2.5,18);
    const dome=new THREE.Mesh(new THREE.SphereGeometry(2.55,18,12,0,6.3,0,1.57),mat(0x401018,0.12));
    dome.position.copy(P(0,0,5)); dome.castShadow=true; g.add(dome);
    cyl(g,2.7,2.7,0.6,mat(0x2a0d12,0.3),0,0,0.3,18); }});
def({ key:"npn", name:"2N2222 NPN (×2 sürücü)", qty:2, col:C.black,
  info:{ t:"2N2222 (TO-92) ×2", d:"IR LED + motor sürücüsü · 1k/470Ω base" },
  asm:[-30,-4,Z.esp+2], exp:[-52,-6,Z.esp+2],
  build(g){ const b=new THREE.Mesh(new THREE.CylinderGeometry(2.6,2.6,4.5,3,1,false,0,Math.PI),mat(0x0c0c0c,0.5));
    b.position.copy(P(0,0,2.3)); b.castShadow=true; g.add(b);
    for(const lx of [-1.27,0,1.27]){const leg=new THREE.Mesh(new THREE.CylinderGeometry(0.28,0.28,4),mat(C.silver,0.3,0.8));
      leg.position.copy(P(lx,0.6,-1.2)); g.add(leg);} }});

// --- 6. Vibration motor 6x14mm (the real part, not a buzzer) ----------------
def({ key:"motor", name:"Titreşim motoru 6×14 mm", qty:1, col:C.alu,
  info:{ t:"Titreşim motoru", d:"6×14 mm · GPIO1 → 470Ω → 2N2222 + 1N5819" },
  asm:[22,-13,Z.esp+2], exp:[44,-14,Z.esp+3],
  build(g){ cyl(g,3,3,14,mat(C.alu,0.3,0.85),0,0,0,24).rotation.z=Math.PI/2;
    cyl(g,1.2,1.2,3,mat(0xb08030,0.4,0.6),7.5,0,0,16).rotation.z=Math.PI/2; // eccentric shaft cap
    // two leads
    for(const s of [-1,1]){const w=new THREE.Mesh(new THREE.CylinderGeometry(0.4,0.4,6),mat(s>0?C.red:C.black,0.5));
      w.position.copy(P(-7.5,s*1.2,0)); w.rotation.z=Math.PI/2; g.add(w);} }});

// --- 7. TP4056 Type-C charger (28x17mm) -------------------------------------
def({ key:"tp4056", name:"TP4056 Type-C şarj", qty:1, col:C.blue,
  info:{ t:"TP4056 Type-C", d:"Koruma (OUT+/OUT− pedi) elindeki üründe doğrulanmadı · boyut ≈26–28×17 mm · LiPo şarj" },
  asm:[-16,-14,Z.rc+1], exp:[-40,-22,Z.rc],
  build(g){ box(g,28,17,1.4,pcbMats(C.blueboard),0,0,0);
    box(g,9,7.4,3.2,mat(C.alu,0.3,0.95),-13.5,0,1.4);     // Type-C
    box(g,3,3,1,mat(0x401010,0.5),6,5,0.7); box(g,3,3,1,mat(0x104020,0.5),10,5,0.7); // LEDs
    box(g,4,3,1.2,mat(C.chip,0.5),2,-3,0.7);              // IC
    smd(g,8,-4,0.7); smd(g,11,-4,0.7); }});

// --- 8. MT3608 boost (37x17mm, 14mm tall w/ pot+inductor) -------------------
def({ key:"mt3608", name:"MT3608 boost", qty:1, col:C.navy,
  info:{ t:"MT3608 boost", d:"Tüm cihazı 5.3V'a çıkarır · yüksüz ayarla" },
  asm:[16,-14,Z.rc+1], exp:[40,-22,Z.rc],
  build(g){ box(g,37,17,1.4,pcbMats(C.navy),0,0,0);
    cyl(g,5,5,5,mat(0x1a1a1a,0.5),8,0,3,20);              // inductor
    box(g,6.5,6.5,4.5,mat(0x1050c0,0.4),-10,2,2.6);       // blue trimmer pot
    cyl(g,2.5,2.5,5.5,mat(0x202020,0.5),-2,-4,3,16);      // electrolytic cap
    box(g,3,3,1.2,mat(C.chip,0.5),2,4,0.7); }});

// --- 9. Mini ON/OFF switch --------------------------------------------------
def({ key:"switch", name:"Mini ON/OFF anahtar", qty:1, col:C.black,
  info:{ t:"ON/OFF anahtar", d:"Sigorta ile MT3608 girişi arasında" },
  asm:[-2,-18,Z.rc+1], exp:[0,-30,Z.rc],
  build(g){ box(g,8,3.5,3,mat(0x141414,0.5),0,0,1.5);
    box(g,2,1.6,2.5,mat(C.silver,0.3,0.8),0,0,3.8); }});

// --- 10. 3.3V/5V level shifter (BSS138) -------------------------------------
def({ key:"shifter", name:"Lojik seviye dönüştürücü", qty:1, col:C.green,
  info:{ t:"Level shifter", d:"RDM6300 TX 5V→3.3V (veya 2.2k/3.3k bölücü)" },
  asm:[18,2,Z.rdm], exp:[46,2,Z.rdm],
  build(g){ box(g,13,10,1.3,pcbMats(C.dkgreen),0,0,0);
    for(const x of [-3,0,3]) smd(g,x,2,0.7,1.2,1.2,C.black);
    headerStrip(g,0,-4,0.8,5,true); headerStrip(g,0,4,0.8,5,true); }});

// --- 11. LiPo 3.7V 1000mAh --------------------------------------------------
def({ key:"lipo", name:"LiPo 3.7V 1000 mAh", qty:1, col:C.lipo,
  info:{ t:"LiPo pil", d:"3.7V 1000 mAh · 2:1 bölücü → IO3 (ADC)" },
  asm:[0,0,Z.case+3.5], exp:[0,6,Z.case-18],
  build(g){ box(g,50,30,6,mat(C.lipo,0.5,0.2),0,0,0);
    box(g,50,30,0.6,mat(C.lipo2,0.6),0,0,3.1); // top seam
    box(g,8,12,2,mat(0x2a2a2e,0.5),-27,0,0);   // tab pouch
    for(const s of [-3,3]){const w=new THREE.Mesh(new THREE.CylinderGeometry(0.5,0.5,8),mat(s>0?C.red:C.black,0.5));
      w.position.copy(P(-30,s,0)); w.rotation.z=Math.PI/2; g.add(w);} }});

// --- 12. divider resistors + caps + PPTC (small detail cluster) -------------
def({ key:"passives", name:"Dirençler · kondansatör · PPTC", qty:1, col:C.chip,
  info:{ t:"Pasifler", d:"2:1 bölücü, 1000µF/100µF, 1.1A PPTC, 1N5819" },
  asm:[-18,2,Z.rc+1], exp:[-40,8,Z.rc],
  build(g){
    for(const [x,y] of [[-4,0],[-4,3]]){ const r=cyl(g,1,1,7,mat(0xd8d2c0,0.5),x,y,1,12); r.rotation.z=Math.PI/2; }
    cyl(g,4,4,8,mat(0x1a1a22,0.5),6,-2,4,18);   // 1000uF electrolytic
    cyl(g,2.5,2.5,5,mat(0x202028,0.5),6,5,2.5,16); // 100uF
    box(g,4.5,4.5,2,mat(0x12502a,0.5),-2,-5,1); // PPTC green disc-ish
  }});

// =========================== BUILD ALL =======================================
const hover = [];
const buckets = {}; // key -> group
for (const p of PARTS) {
  const g = new THREE.Group();
  p.build(g);
  g.traverse(o => { if (o.isMesh && !o.userData.info) o.userData.info = p.info; if (o.isMesh) hover.push(o); });
  g.userData.asm = P(...p.asm);
  g.userData.exp = P(...p.exp);
  g.position.copy(g.userData.asm);
  root.add(g); buckets[p.key] = g;
}

// --- translucent 3D-printed case shell (two halves) -------------------------
const caseGroup = new THREE.Group(); root.add(caseGroup);
// Frosted-glass look done right for a dark scene: each panel is a very faint
// translucent fill PLUS a crisp edge outline, so the shell reads as a clear
// enclosure you can see the boards through, not a solid white box.
const caseMat = new THREE.MeshStandardMaterial({
  color:0x6f86a8, roughness:0.5, metalness:0, transparent:true, opacity:0.12,
  side:THREE.DoubleSide, depthWrite:false });
const edgeMat = new THREE.LineBasicMaterial({ color:0x9fd0ff, transparent:true, opacity:0.55 });
const CW=68, CD=46, wall=1.6;
const seamZ = 24;                 // lid/tray seam
const botH = seamZ - (Z.case-5);
const lidH = (Z.lid+5) - seamZ + 5;
const botZ = (Z.case-5) + botH/2;
const lidZ = seamZ + lidH/2;
function panel(g, w, d, t, x, y, z) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, t, d), caseMat);
  m.position.copy(P(x, y, z)); m.renderOrder = 2; g.add(m);
  const edges = new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry), edgeMat);
  edges.position.copy(m.position); g.add(edges);
}
function shell(zc, h, isLid) {
  const g = new THREE.Group();
  panel(g, CW, CD, wall, 0, 0, isLid? h/2-wall/2 : -h/2+wall/2); // cap
  panel(g, CW, wall, h, 0, CD/2-wall/2, 0);
  panel(g, CW, wall, h, 0, -CD/2+wall/2, 0);
  panel(g, wall, CD-2*wall, h, CW/2-wall/2, 0, 0);
  panel(g, wall, CD-2*wall, h, -CW/2+wall/2, 0, 0);
  if (isLid) { // screen window frame on top
    const fr = mat(0x0c0f16, 0.4); fr.transparent=true; fr.opacity=0.9;
    for (const [dx,dy,w,d] of [[-4,13.5,29,2],[-4,-13.5,29,2],[11.5,0,2,29],[-19.5,0,2,29]])
      box(g, w, d, 1.2, fr, dx, dy, h/2-wall/2+0.7);
  }
  g.position.copy(P(0,0,zc));
  return g;
}
const caseBottom = shell(botZ, botH, false);
const caseLid = shell(lidZ, lidH, true);
caseGroup.add(caseBottom, caseLid);
caseBottom.userData.asm = caseBottom.position.clone();
caseBottom.userData.exp = caseBottom.position.clone().add(new THREE.Vector3(0,-58,0));
caseLid.userData.asm = caseLid.position.clone();
caseLid.userData.exp = caseLid.position.clone().add(new THREE.Vector3(0,60,0));

// =========================== WIRES ==========================================
const wires = new THREE.Group(); root.add(wires);
const WCOL = { yellow:0xffd21a, orange:0xff7d1f, green:0x27d651, blue:0x3d7bff,
  purple:0xa24dff, red:0xff2e2e, white:0xe8ecf2, cyan:0x1fd6e6, gray:0x8a8f9a, black:0x15171c };
const espTop = Z.esp + 0.8;
const ep = (x, s) => P(x, 11.4 * s, espTop);
const WIRES = [
  // SPI shared bus → LCD and RC522
  ["SCK IO18 → LCD","yellow", ep(-9,1), b("lcd",-20,13,-1)],
  ["SCK IO18 → RC522","yellow", ep(-9,1), b("rc522",-24,19,1)],
  ["MOSI IO19 → LCD","orange", ep(-6,1), b("lcd",-16,13,-1)],
  ["MOSI IO19 → RC522","orange", ep(-6,1), b("rc522",-20,19,1)],
  ["LCD CS IO9","green", ep(-3,1), b("lcd",-12,13,-1)],
  ["LCD DC IO8","blue", ep(0,1), b("lcd",-8,13,-1)],
  ["LCD RST IO20","purple", ep(3,1), b("lcd",-4,13,-1)],
  ["LCD BL IO21","white", ep(6,1), b("lcd",0,13,-1)],
  ["MISO IO5 → RC522","cyan", ep(9,1), b("rc522",-14,19,1)],
  ["RC522 CS IO7","green", ep(12,1), b("rc522",-10,19,1)],
  ["RC522 RST IO2","red", ep(15,1), b("rc522",-6,19,1)],
  // right/bottom side peripherals
  ["RDM TX IO15","orange", ep(15,-1), b("shifter",0,-4,1)],
  ["IR RX IO4","blue", ep(11,-1), b("irrx",0,-2,0)],
  ["IR TX IO0","purple", ep(8,-1), b("npn",0,2,1)],
  ["Motor IO1","green", ep(5,-1), b("motor",-7,1,0)],
  ["Batt sense IO3","yellow", ep(2,-1), b("passives",-4,2,2)],
  // power chain
  ["LiPo → TP4056","red", b("lipo",-28,2,0), b("tp4056",-13,0,1)],
  ["TP4056 → anahtar","red", b("tp4056",13,0,1), b("switch",-4,0,2)],
  ["anahtar → MT3608","red", b("switch",4,0,2), b("mt3608",-18,0,1)],
  ["MT3608 5V → ESP","red", b("mt3608",18,0,1), ep(-12,-1)],
  ["MT3608 5V → RDM","orange", b("mt3608",18,2,1), b("rdm",14,6,1)],
];
function b(key, dx, dy, dz) { // absolute point on a part (asm position + local)
  const g = buckets[key]; const base = g.userData.asm;
  return base.clone().add(P(dx, dy, dz).sub(P(0,0,0)));
}
const wireMeshes = [];
for (const [name, col, a, bb] of WIRES) {
  const span = a.distanceTo(bb);
  const lift = Math.max(a.y, bb.y) + Math.min(span * 0.2, 12) + 3;
  const mid = a.clone().lerp(bb, 0.5); mid.y = lift;
  const q1 = a.clone().lerp(mid, 0.5); q1.y = (a.y + lift)/2;
  const q3 = mid.clone().lerp(bb, 0.5); q3.y = (lift + bb.y)/2;
  const curve = new THREE.CatmullRomCurve3([a, q1, mid, q3, bb]);
  const m = new THREE.Mesh(new THREE.TubeGeometry(curve, 50, 0.45, 7),
    new THREE.MeshStandardMaterial({ color: WCOL[col], roughness:0.45, transparent:true }));
  m.castShadow = true; m.userData.info = { t:name, d:"Kablo bağlantısı" };
  wires.add(m); wireMeshes.push(m); hover.push(m);
}

// =========================== SCREEN MENU ====================================
(function drawScreen() {
  const S = 512, cv = document.createElement("canvas"); cv.width = cv.height = S;
  const g = cv.getContext("2d");
  g.fillStyle = "#061320"; g.fillRect(0,0,S,S);
  g.fillStyle = "#0a6cff"; g.fillRect(0,0,S,76);
  g.fillStyle = "#fff"; g.font = "bold 36px 'Courier New',monospace"; g.textBaseline="middle";
  g.fillText("Makeshift", 20, 38);
  g.font = "24px 'Courier New',monospace"; g.fillStyle="#bfe0ff"; g.fillText("82%", S-96, 38);
  const items=["RFID / NFC","Kizilotesi","SecLab","Hacking","Ayarlar"];
  const ic=["◉","«","⚿","⚡","⚙"];
  items.forEach((it,i)=>{ const y=108+i*74;
    if(i===1){ g.fillStyle="#113a5e"; g.fillRect(8,y-32,S-16,64); g.fillStyle="#0a6cff"; g.fillRect(8,y-32,8,64); }
    g.fillStyle=i===1?"#8fd0ff":"#3f82b8"; g.font="36px 'Courier New',monospace"; g.fillText(ic[i],28,y);
    g.fillStyle=i===1?"#ffffff":"#aab8c6"; g.font="32px 'Courier New',monospace"; g.fillText(it,84,y); });
  const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace;
  if (screenMat){ screenMat.map=tex; screenMat.emissiveMap=tex; screenMat.needsUpdate=true; }
})();

// =========================== LABELS =========================================
const labels = new THREE.Group(); root.add(labels);
function roundRect(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);
  g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function label(text, pos) {
  const pad=14,f=26,cv=document.createElement("canvas"),g=cv.getContext("2d");
  g.font=`${f}px system-ui`; const w=g.measureText(text).width;
  cv.width=w+pad*2; cv.height=f+pad; g.font=`${f}px system-ui`;
  g.fillStyle="rgba(8,12,20,.85)"; roundRect(g,0,0,cv.width,cv.height,9); g.fill();
  g.strokeStyle="rgba(78,163,255,.55)"; g.lineWidth=2; roundRect(g,1,1,cv.width-2,cv.height-2,8); g.stroke();
  g.fillStyle="#eaf1ff"; g.textBaseline="middle"; g.fillText(text,pad,cv.height/2);
  const tex=new THREE.CanvasTexture(cv); tex.colorSpace=THREE.SRGBColorSpace;
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,depthTest:false,transparent:true}));
  s.scale.set(cv.width*0.11,cv.height*0.11,1); s.position.copy(pos); s.userData.lab=true; labels.add(s);
}

// =========================== LEGEND UI ======================================
const legend = document.getElementById("legend");
for (const p of PARTS) {
  const d = document.createElement("div"); d.className="leg";
  d.innerHTML = `<span class="sw" style="background:#${p.col.toString(16).padStart(6,'0')}"></span>${p.name}` +
    (p.qty>1?`<small>×${p.qty}</small>`:``);
  d.onmouseenter = () => highlight(p.key, true);
  d.onmouseleave = () => highlight(p.key, false);
  legend.appendChild(d);
}
function highlight(key, on) {
  const g = buckets[key]; if(!g) return;
  g.traverse(o=>{ if(o.isMesh){ o.material.emissive = o.material.emissive||new THREE.Color();
    o.material.emissiveIntensity = on?0.4:(o===g.children[0]?0:o.material.emissiveIntensity||0);
    if(!o.material._base) o.material._base = o.material.emissive.getHex();
    o.material.emissive.setHex(on?0x2a5cff:(o.material._base||0)); } });
}

// =========================== INTERACTION ====================================
let mode = "asm", spin = true, exT = 0; // exT: 0..1 explode target
const setMode = m => { mode=m; for(const id of ["mAsm","mExp","mCase"]) document.getElementById(id).classList.toggle("on", id==="m"+m[0].toUpperCase()+m.slice(1)); };
function setSlider(v){ document.getElementById("exR").value=v; document.getElementById("exV").textContent=Math.round(v)+"%"; }
document.getElementById("mAsm").onclick=()=>{ setMode("asm"); exT=0; setSlider(0); caseVisible(true); };
document.getElementById("mExp").onclick=()=>{ setMode("exp"); exT=1; setSlider(100); caseVisible(true); };
document.getElementById("mCase").onclick=()=>{ setMode("case"); exT=0; setSlider(0); caseVisible(false); document.getElementById("tCase").checked=false; };
document.getElementById("exR").oninput=e=>{ exT=e.target.value/100; document.getElementById("exV").textContent=e.target.value+"%";
  if(exT>0.02 && mode==="asm") setMode("exp"); };
document.getElementById("bSpin").onclick=e=>{ spin=!spin; e.target.textContent="Otomatik döndür: "+(spin?"açık":"kapalı"); };
function caseVisible(v){ caseGroup.visible=v && document.getElementById("tCase").checked; }
document.getElementById("tCase").onchange=e=>{ caseGroup.visible=e.target.checked && mode!=="case"; };
document.getElementById("tWire").onchange=e=>{ wires.visible=e.target.checked; };
document.getElementById("tLabel").onchange=e=>{ labels.visible=e.target.checked; };
document.getElementById("tExport").onchange=e=>{ if(e.target.checked){ e.target.checked=false; exportGLB(); } };

// labels follow exploded positions
label("ESP32-C6", P(0,0,Z.esp));
const labelFor = { lcd:"LCD + joystick", rc522:"RC522", rdm:"RDM6300", irrx:"IR + sürücü",
  motor:"Titreşim motoru", tp4056:"TP4056", mt3608:"MT3608", lipo:"LiPo" };

const ray=new THREE.Raycaster(), mouse=new THREE.Vector2(), tip=document.getElementById("tip");
addEventListener("pointermove", e=>{
  mouse.x=(e.clientX/innerWidth)*2-1; mouse.y=-(e.clientY/innerHeight)*2+1;
  ray.setFromCamera(mouse,cam);
  const hit=ray.intersectObjects(hover,false).find(h=>h.object.visible && h.object.userData.info);
  if(hit){ const i=hit.object.userData.info; tip.innerHTML=`<b>${i.t}</b><span>${i.d}</span>`;
    tip.style.display="block"; tip.style.left=Math.min(e.clientX+14,innerWidth-262)+"px";
    tip.style.top=(e.clientY+14)+"px"; }
  else tip.style.display="none";
});
addEventListener("resize",()=>{ cam.aspect=innerWidth/innerHeight; cam.updateProjectionMatrix(); ren.setSize(innerWidth,innerHeight); });

function exportGLB(){
  const ex=new GLTFExporter();
  ex.parse(root,(buf)=>{ const blob=new Blob([buf],{type:"model/gltf-binary"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
    a.download="makeshift_flipper.glb"; a.click(); },
    (err)=>console.error(err),{binary:true});
}

// =========================== LOOP ===========================================
const allGroups = [...PARTS.map(p=>buckets[p.key]), caseBottom, caseLid];
document.getElementById("load").style.display="none";
ren.setAnimationLoop(()=>{
  for(const g of allGroups){ const target = g.userData.asm.clone().lerp(g.userData.exp, exT);
    g.position.lerp(target, 0.1); }
  const wTarget = exT>0.05?1:0;
  wireMeshes.forEach(w=>{ w.material.opacity = THREE.MathUtils.lerp(w.material.opacity, wTarget, 0.12); });
  wires.visible = document.getElementById("tWire").checked && exT>0.03;
  if(spin){ ctl.autoRotate=true; ctl.autoRotateSpeed=0.85; } else ctl.autoRotate=false;
  ctl.update(); ren.render(scene,cam);
});
</script>
