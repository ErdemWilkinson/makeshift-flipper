name: Build

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-flipper:
    name: Build firmware (esp32c6)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build firmware for esp32c6
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3.1
          target: esp32c6
          path: '.'

  host-tests:
    name: Host logic tests (tests/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run host tests
        run: bash tests/run_tests.sh
