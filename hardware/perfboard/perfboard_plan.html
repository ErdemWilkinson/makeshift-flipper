<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Perfboard Planı</title>
<style>
  :root { --bg:#0e1116; --panel:#171b23; --line:#2a303c; --fg:#e8ebf2; --dim:#9aa3b2; --acc:#4ea3ff; --ok:#3ecf8e; --warn:#ffb84d; --bad:#ff5c5c; }
  * { box-sizing:border-box; }
  html,body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.5 -apple-system,system-ui,"Segoe UI",sans-serif; }
  header { padding:14px 20px; border-bottom:1px solid var(--line); display:flex; gap:16px; align-items:baseline; flex-wrap:wrap; }
  header h1 { font-size:17px; margin:0; }
  header span { color:var(--dim); font-size:13px; }
  #app { display:grid; grid-template-columns:minmax(0,1.15fr) minmax(340px,.85fr); gap:16px; padding:16px; align-items:start; }
  @media (max-width:980px){ #app{ grid-template-columns:1fr; } }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; }
  #tools { display:flex; flex-wrap:wrap; gap:6px; padding:10px; border-bottom:1px solid var(--line); align-items:center; }
  .stg { background:#222836; color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:6px 10px; cursor:pointer; font-size:13px; }
  .stg.on { background:var(--acc); color:#06121f; border-color:var(--acc); font-weight:600; }
  .stg:hover { border-color:var(--acc); }
  label.t { color:var(--dim); font-size:13px; display:flex; gap:6px; align-items:center; cursor:pointer; margin-left:8px; }
  #boardwrap { padding:10px; }
  svg { width:100%; height:auto; display:block; border-radius:8px; background:#0b0f0d; }
  #side { padding:14px 16px; }
  #side h2 { font-size:15px; margin:0 0 6px; }
  #side ul { margin:6px 0 10px 18px; padding:0; color:#c7cdd9; }
  #side li { margin:3px 0; }
  .test { background:#13261e; border:1px solid #1f4a37; color:#bfeed6; padding:8px 10px; border-radius:8px; margin:8px 0 12px; font-size:13px; }
  details { background:#1a1f29; border:1px solid var(--line); border-radius:10px; padding:8px 12px; margin-bottom:12px; }
  details summary { cursor:pointer; font-weight:600; }
  details li { color:#c7cdd9; margin:4px 0; }
  table { width:100%; border-collapse:collapse; font-size:12.5px; }
  th,td { text-align:left; padding:5px 6px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--dim); font-weight:500; }
  tr.done td { opacity:.45; text-decoration:line-through; }
  tr.hl td { background:#1e2736; }
  .sw { display:inline-block; width:11px; height:11px; border-radius:3px; margin-right:5px; vertical-align:-1px; border:1px solid #fff3; }
  .short { color:var(--warn); }
  #tip { position:fixed; pointer-events:none; display:none; background:#05070b; border:1px solid var(--acc); border-radius:8px; padding:6px 10px; font-size:12px; z-index:9; max-width:260px; }
  #legend { display:flex; flex-wrap:wrap; gap:10px 16px; padding:8px 12px; color:var(--dim); font-size:12px; border-top:1px solid var(--line); }
  .mono { font-family:ui-monospace,Consolas,monospace; }
  .bannerwarn { background:#2a1f10; border:1px solid #5a4116; color:#ffd9a0; padding:8px 12px; border-radius:8px; margin-bottom:12px; font-size:13px; }
</style>
</head>
<body>
<header>
  <h1>Makeshift Flipper · Perfboard bağlantı planı</h1>

</header>
<div id="app">

</div>

    if (!active && used) { el("circle", { cx, cy, r: 3, fill: "none", stroke: "#4a5a52", "stroke-width": 1 }, pg); return; }
    if (p.strap && (p.ref === "J1" || p.ref === "J3")) el("circle", { cx, cy, r: 8.4, fill: "none", stroke: "#ffb84d", "stroke-width": 1.4, "stroke-dasharray": "2 2" }, pg);
    const c = el("circle", { cx, cy, r: used ? 5.4 : 3.2, fill: used ? col : "#30403a", stroke: used ? "#000a" : "#52665c", "stroke-width": 1 }, pg);
    if (p.forbid) {
      el("circle", { cx, cy, r: 7.5, fill: "rgba(255,70,70,.25)", stroke: "#ff4b4b", "stroke-width": 1.6 }, pg);
      el("path", { d: `M${cx - 4.5},${cy - 4.5} L${cx + 4.5},${cy + 4.5} M${cx + 4.5},${cy - 4.5} L${cx - 4.5},${cy + 4.5}`, stroke: "#ff4b4b", "stroke-width": 2 }, pg);
    }
    c.addEventListener("mousemove", ev => showTip(ev, `<b>${p.ref} · ${p.label || p.pin}</b><br>pad x${p.x}, y${p.y}${p.net ? "<br>ağ: " + p.net : ""}${p.forbid ? "<br><span style='color:#ff7b7b'>⛔ ASLA tel bağlama</span>" : ""}${p.strap ? "<br><span style='color:#ffb84d'>strap pini: reset'te düşük çekme</span>" : ""}`));
    c.addEventListener("mouseleave", hideTip);
    if (showLabels && p.lab && p.label && active && (used || p.forbid)) {
      const flip = mirror ? { r: "l", l: "r", t: "t", b: "b" } : { r: "r", l: "l", t: "t", b: "b" };
      const d = flip[p.lab];
      const off = d === "r" ? [9, 3, "start"] : d === "l" ? [-9, 3, "end"] : d === "t" ? [0, -10, "middle"] : [0, 16, "middle"];
      el("text", { x: cx + off[0], y: cy + off[1], fill: p.forbid ? "#ff8b8b" : "#d5dde8", "font-size": 8.6, "text-anchor": off[2] }, pg, p.label);
    }
  });
}
const padLbl = id => { const p = padById[id]; return `${p.ref}.${p.label || p.pin}`; };

function renderTools() {
  const t = document.getElementById("tools"); t.innerHTML = "";
  D.stages.forEach(s => {
    const b = document.createElement("button"); b.className = "stg" + (s.n === stage ? " on" : ""); b.textContent = "Adım " + s.n;
    b.onclick = () => { stage = s.n; hlWire = null; render(); }; t.appendChild(b);
  });
  const m = document.createElement("label"); m.className = "t";
  m.innerHTML = `<input type="checkbox" ${mirror ? "checked" : ""}> Arka (lehim) yüzü`;
  m.firstChild.onchange = e => { mirror = e.target.checked; render(); }; t.appendChild(m);
  const l = document.createElement("label"); l.className = "t";
  l.innerHTML = `<input type="checkbox" ${showLabels ? "checked" : ""}> Pin etiketleri`;
  l.firstChild.onchange = e => { showLabels = e.target.checked; render(); }; t.appendChild(l);
}
function renderSide() {
  const s = D.stages.find(x => x.n === stage);
  const ws = D.wires.filter(w => w.stage === stage);
  const side = document.getElementById("side");
  let h = `<details ${stage === 1 ? "open" : ""}><summary>Başlamadan önce doğrula (5 dk)</summary><ul>
   <li><b>C6 şeritleri:</b> iki sıra arası <b>9 delik</b> mi (~22.9 mm, cetvelle)? Üzerindeki yazı J1 için <span class="mono">3V3 RST 4 5 6 7 0 1 8 10 11 2 3 5V G NC</span>, J3 için <span class="mono">G TX RX 15 23 22 21 20 19 18 9 G 13 12 G NC</span> sırasında mı? Anten ucu üstte, USB-C altta kalacak.</li>
   <li><b>Ekran:</b> arkasında hazır lehimli 2×20 <b>dişi</b> soket var (Waveshare/ThePihut); plakada karşılığı <b>erkek</b> pin şeridi gerekir. Yön: ekranın üzerinde <b>"USB" yazılı uç</b> = Pico'nun USB ucu = pin 1 ucu; bu uç plakanın <b>üst</b> kenarına baksın (Waveshare wiki'nin kendi yön tarifi). Ters takarsan tüm pinler yer değiştirir.</li>
   <li><b>RC522, RDM6300, VS1838B, 2N2222:</b> bacak sırasını modülün yazısından oku. Burada çizilen sıradan farklıysa ilgili portun sırasını değiştirip tel listesini yeniden üretmemi iste.</li>
   <li><b>Güç vermeden</b> her adımdan sonra 3V3↔GND ve 5V↔GND süreklilik testi.</li></ul></details>`;
  h += `<h2>Adım ${s.n} — ${s.title}</h2><ul>${s.intro.map(i => `<li>${i}</li>`).join("")}</ul>`;
  h += `<div class="test"><b>Test:</b> ${s.test}</div>`;
  h += `<table><thead><tr><th></th><th>#</th><th>Nereden → nereye</th><th>Boy</th></tr></thead><tbody>`;
  ws.forEach(w => {
    h += `<tr data-n="${w.n}" class="${done[w.n] ? "done" : ""} ${hlWire === w.n ? "hl" : ""}"><td><input type="checkbox" ${done[w.n] ? "checked" : ""} data-n="${w.n}"></td>
      <td>${w.n}</td><td><span class="sw" style="background:${w.color}"></span>${padLbl(w.a)} <span style="color:var(--dim)">(x${w.ax},y${w.ay})</span><br>→ ${padLbl(w.b)} <span style="color:var(--dim)">(x${w.bx},y${w.by})</span>
      <div style="color:var(--dim)">${w.cname} · ${w.net}</div></td>
      <td>${w.short ? `<span class="short">köprü<br>1-2 delik</span>` : `${w.holes} delik<br>kes ${w.cut_cm} cm`}</td></tr>`;
  });
  h += `</tbody></table>`;
  if (s.n === 9) {
    h = h.replace(/<table>[\s\S]*<\/table>/, "");
    h += `<table><thead><tr><th>Nereden</th><th>Nereye</th><th>Renk</th></tr></thead><tbody>` +
      D.harness.map(r => `<tr><td>${r[0]}</td><td>${r[1]}${r[3] ? `<div style="color:var(--dim)">${r[3]}</div>` : ""}</td><td>${r[2]}</td></tr>`).join("") + `</tbody></table>`;
  } else if (!ws.length) h += `<p style="color:var(--dim)">Bu adımda yeni tel yok.</p>`;
  side.innerHTML = h;
  side.querySelectorAll("input[type=checkbox][data-n]").forEach(c => c.onchange = e => {
    done[c.dataset.n] = e.target.checked; saveDone(); renderSide(); });
  side.querySelectorAll("tbody tr").forEach(tr => tr.onclick = ev => {
    if (ev.target.tagName === "INPUT") return;
    const n = +tr.dataset.n; hlWire = hlWire === n ? null : n; render(); });
}
function renderLegend() {
  document.getElementById("legend").innerHTML =
    `<span>⛔ kırmızı çarpı: asla tel (IO12/13, TX/RX)</span><span><span style="color:#ffb84d">◌</span> turuncu halka: strap pini</span>` +
    `<span>kalın tel = bu adımda eklenecek · soluk = önceki adımlar · tele tıkla/üstüne gel</span>`;
}
function render() { renderTools(); drawBoard(); renderSide(); renderLegend(); }
render();
</script>
</body>
</html>
