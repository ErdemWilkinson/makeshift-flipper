<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cep Çubuğu 3D</title>
<style>
  :root { --bg:#0e1016; --panel:#171a22; --line:#282d39; --fg:#e9ecf3; --dim:#9298a6; --acc:#4ea3ff; --ok:#3ecf8e; --warn:#ffb84d; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:14px/1.5 -apple-system,system-ui,"Segoe UI",sans-serif; overflow:hidden; }
  #c { position:fixed; inset:0; }
  .panel { position:fixed; background:rgba(23,26,34,.93); border:1px solid var(--line); border-radius:13px; backdrop-filter:blur(8px); box-shadow:0 10px 36px rgba(0,0,0,.45); }
  #hud { left:16px; top:16px; width:270px; padding:14px 16px; }
  #hud h1 { font-size:16px; margin:0 0 2px; }
  #hud .sub { color:var(--dim); font-size:12px; margin-bottom:12px; }
  .row { display:flex; gap:6px; margin-bottom:8px; flex-wrap:wrap; }
  button { background:#232733; color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:7px 10px; font-size:13px; cursor:pointer; flex:1; }
  button:hover { border-color:var(--acc); } button.on { background:var(--acc); color:#06121f; border-color:var(--acc); font-weight:600; }
  input[type=range] { width:100%; accent-color:var(--acc); }
  label.chk { display:flex; gap:8px; align-items:center; color:var(--dim); font-size:13px; cursor:pointer; padding:2px 0; }
  #side { right:16px; top:16px; width:410px; max-height:calc(100vh - 32px); overflow:auto; padding:14px 16px; }
  #side h2 { font-size:13px; text-transform:uppercase; letter-spacing:1.1px; color:var(--dim); margin:14px 0 8px; }
  #side h2:first-child { margin-top:0; }
  table { width:100%; border-collapse:collapse; font-size:12.5px; }
  td,th { padding:4px 5px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; }
  td.n, th.n { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .ok { color:var(--ok); } .warn { color:var(--warn); }
  .note { background:#241d10; border:1px solid #5a4116; color:#ffd9a0; border-radius:8px; padding:8px 10px; font-size:12.5px; margin:8px 0; }
  .good { background:#13261e; border:1px solid #1f4a37; color:#bfeed6; border-radius:8px; padding:8px 10px; font-size:12.5px; margin:8px 0; }
  a { color:var(--acc); }
  #tip { position:fixed; pointer-events:none; display:none; background:#04060b; border:1px solid var(--acc); border-radius:8px; padding:6px 10px; font-size:12px; z-index:9; max-width:290px; }
  @media (max-width:900px){ #side{ display:none; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud" class="panel">
  <h1>Cep çubuğu</h1>
  <div class="sub">elindeki parçalarla cebe giren yerleşim</div>
  <div class="row"><button id="bAsm" class="on">Montajlı</button><button id="bExp">Patlatılmış</button></div>
  <label style="color:var(--dim);font-size:12px">Patlatma <span id="exV">0%</span></label>
  <input type="range" id="ex" min="0" max="100" value="0">
  <div class="row" style="margin-top:8px"><button id="vIso">Eğik</button><button id="vTop">Üst</button></div>
  <div class="row"><button id="vBack">Arka</button><button id="vSide">Yan</button></div>
  <label class="chk"><input type="checkbox" id="tShell" checked> Kabuk (yarı saydam)</label>
  <label class="chk"><input type="checkbox" id="tFlip"> Flipper Zero ölçüsü (referans)</label>
  <label class="chk"><input type="checkbox" id="tWire" checked> Kablolar</label>
  <label class="chk"><input type="checkbox" id="tLabels" checked> Ölçü etiketleri</label>
  <label class="chk"><input type="checkbox" id="tSpin"> Otomatik döndür</label>
  <div style="color:var(--dim);font-size:11px;margin-top:8px">Parçanın üstüne gel: ne olduğu. Sağda boyut, çakışma kontrolü, riskler.</div>
</div>
<div id="side" class="panel"></div>
<div id="tip"></div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";

// ---------------------------------------------------------------- yerleşim (mm)
// İç koordinat: x = uzunluk (0 = alt/USB ucu), y = genişlik, z = kalınlık (0 = arka duvar, T = ön/ekran yüzü).
// Her parça [x0, y0, z0, dx, dy, dz]. Kaynak notları: v = doğrulandı, e = tahmin/standart, m = senin ölçmen gerek.
const WALL = 1.6;
const L = 118, W = 46;                // iç ölçü: RC522 (60x40) en geniş modül -> W=46, boyu: C6 bölgesi 66 + ekran bölgesi 52
const LCD_Z = 9.2 + 8.45 + 2.5;       // ekran PCB altı: plaka üstü + erkek plastik + dişi soket (v)
const T = LCD_Z + 1.6 + 5.0 + 0.5;    // iç kalınlık: ekran PCB + joystick (e) + 0.5 boşluk
const PARTS = [
  // key, ad, kutu, renk, grup, kaynak, açıklama
  ["coil",  "125 kHz bobin",       [10, 6.5, 0, 46, 33, 3],      0x8a5a2b, "back",  "v", "46×33×3 mm. Arka duvara bakar. Pilden ve RC522'den uzak tut."],
  ["rc522", "RC522",               [2, 3, 3.5, 60, 40, 4.6],     0x1746b8, "back",  "v", "60×40 mm, anten döngüsü ARKAYA bakar. Çip/pin kartın içine (öne) bakar."],
  ["m1",    "Ana plaka M1 (C6 bölgesi)", [0, 0, 10.1, 66, 46, 1.6], 0x9c7b3c, "mid",   "e", "Delikli plaka parçası: C6, güç modülleri, portlar. Alt tarafta 1.5 mm lehim ucu için RC522 ile 2 mm boşluk."],
  ["c6",    "ESP32-C6-DEV-KIT",    [0.5, 1, 11.7, 51.8, 25.4, 7.5], 0x11602f, "mid", "e", "51.8×25.4 mm (DevKitC-1 çizimi; Waveshare ölçüsü doğrulanmadı). Pinleri plakaya doğrudan lehimli (soket yok), USB-C alt uçta, anten üst uçta."],
  ["tp",    "TP4056 Type-C",       [2, 28.5, 12.7, 26, 17, 5],   0x1746b8, "mid",   "e", "≈26×17 mm. Type-C alt duvarda. Koruma (OUT+/OUT−) doğrulanmadı."],
  ["mt",    "MT3608 boost",        [29, 28.5, 12.7, 37, 17, 14], 0x0b1f6b, "mid",   "m", "37×17 mm. Yükseklik kaynaklarda 7 mm ile 14 mm arası çelişiyor; 14 mm ile hesaplandı, ölç."],
  ["rdm",   "RDM6300 kartı",       [1, 4, 20.8, 38.5, 19, 6.4],  0x6a0f12, "front", "e", "38.5×19 mm. Kapağın iç yüzüne bantla; C6'nın üstünde 1.6 mm boşluk. 4–5 pinli başlık: yazıyı oku."],
  ["m2",    "Ekran plakası M2",    [66, 0, 7.6, 52, 46, 1.6],    0x9c7b3c, "mid",   "e", "Ekranın 2×20 erkek pinlerini tutar; pil üstünde."],
  ["bat",   "LiPo 3.7V 1000 mAh",  [67, 6, 0.3, 50, 34, 5.5],    0x6f7684, "back",  "m", "503450 ≈ 50×34×5.5 mm; bazı 1000 mAh piller 51×30×7: kendi pilini ölç. Bobinden ve RC522'den ayrı bölgede."],
  ["lcd",   "Pico-LCD-1.3",        [66, 9.75, 9.2, 52, 26.5, 17.55], 0x0f1115, "front", "v", "52×26.5 mm, ST7789 240×240. Dişi soket 8.45 + erkek plastik 2.5 = 10.95 mm boşluk."],
  ["drv",   "Sürücü blokları",     [67, 0.5, 9.2, 24, 8.5, 8],   0x2a2a2e, "mid",   "e", "2N2222A ×2, dirençler, 1N5819, JP1. Plan yeniden çizilmeli (şimdiki plan 38×38 delik)."],
  ["mot",   "Titreşim motoru 6×14", [92, 1.5, 9.2, 14, 6, 6],    0xa8aab3, "mid",   "v", "6×14 mm, Q2 ile sürülür."],
  ["irtx",  "IR verici (KY-005)",  [107.5, 0.5, 9.2, 10, 8.5, 8], 0x401018, "mid",  "m", "KY-005 modülü; boyut yaklaşık (doğrulanmadı). Üst duvardaki pencereye bakar."],
  ["pptc",  "PPTC 1.1 A",          [68, 38, 9.2, 6, 4, 3],       0x12502a, "mid",   "e", "Siparişte yok."],
  ["sw",    "Güç anahtarı",        [82, 36.6, 9.2, 10, 9.4, 10], 0x222226, "mid",   "m", "Yuvarlak mini ON/OFF; kolu yan duvardan çıkar. Çap senin parçanda ölçülmeli."],
  ["c2",    "C2 100 µF",           [93, 38, 9.2, 5, 5, 11],      0x1a1a22, "mid",   "e", "RDM6300 5V girişi."],
  ["c1",    "C1 470–1000 µF",      [100, 37.5, 9.2, 8, 8, 11.5], 0x1a1a22, "mid",   "m", "Ø8 sığar. Listedeki 1000 µF/10V genelde Ø10×16: SIĞMAZ, 470 µF Ø8 kullan."],
  ["irrx",  "VS1838B IR alıcı",    [110, 38, 9.2, 7, 6, 5.5],    0x151515, "mid",   "e", "Üst duvardaki pencereye bakar."],
];
const BOXES = PARTS.map(p => ({ key: p[0], name: p[1], b: p[2], col: p[3], grp: p[4], src: p[5], info: p[6] }));
const Lo = L + 2 * WALL, Wo = W + 2 * WALL, To = T + 2 * WALL;
const VOL = Lo * Wo * To / 1000;
const FLIP = { L: 100.3, W: 40.1, T: 25.6 };
const FVOL = FLIP.L * FLIP.W * FLIP.T / 1000;

function overlap(a, b) {
  const A = a.b, B = b.b;
  return A[0] < B[0] + B[3] - 1e-6 && B[0] < A[0] + A[3] - 1e-6 &&
         A[1] < B[1] + B[4] - 1e-6 && B[1] < A[1] + A[4] - 1e-6 &&
         A[2] < B[2] + B[5] - 1e-6 && B[2] < A[2] + A[5] - 1e-6;
}
const clashes = []; for (let i = 0; i < BOXES.length; i++) for (let j = i + 1; j < BOXES.length; j++) if (overlap(BOXES[i], BOXES[j])) clashes.push(BOXES[i].name + " ↔ " + BOXES[j].name);
const outside = BOXES.filter(p => p.b[0] < -1e-6 || p.b[1] < -1e-6 || p.b[2] < -1e-6 || p.b[0] + p.b[3] > L + 1e-6 || p.b[1] + p.b[4] > W + 1e-6 || p.b[2] + p.b[5] > T + 1e-6).map(p => p.name);
const usedVol = BOXES.reduce((s, p) => s + p.b[3] * p.b[4] * p.b[5], 0);

// ---------------------------------------------------------------- scene
const P3 = (x, y, z) => new THREE.Vector3(x, y, z);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x0e1016);
scene.fog = new THREE.Fog(0x0e1016, 450, 1200);
const cam = new THREE.PerspectiveCamera(36, innerWidth / innerHeight, 1, 4000);
const ren = new THREE.WebGLRenderer({ canvas: document.getElementById("c"), antialias: true });
ren.setPixelRatio(Math.min(devicePixelRatio, 2)); ren.setSize(innerWidth, innerHeight);
ren.shadowMap.enabled = true; ren.shadowMap.type = THREE.PCFSoftShadowMap; ren.toneMapping = THREE.ACESFilmicToneMapping;
const ctl = new OrbitControls(cam, ren.domElement); ctl.enableDamping = true; ctl.target.set(0, T / 2, 0);
scene.add(new THREE.HemisphereLight(0xdbe8ff, 0x2a2c34, 1.0));
const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(120, 260, 160); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); Object.assign(key.shadow.camera, { near: 50, far: 800, left: -170, right: 170, top: 170, bottom: -170 }); scene.add(key);
const under = new THREE.DirectionalLight(0xffffff, 0.9); under.position.set(-80, -220, -90); scene.add(under);
const rim = new THREE.DirectionalLight(0x5c8cff, 0.7); rim.position.set(-150, 80, -120); scene.add(rim);
const floor = new THREE.Mesh(new THREE.CircleGeometry(700, 64), new THREE.MeshStandardMaterial({ color: 0x090b10, roughness: 1 }));
floor.rotation.x = -Math.PI / 2; floor.position.y = -60; floor.receiveShadow = true; scene.add(floor);

// ---------------------------------------------------------------- helpers
const M = (c, r = 0.6, m = 0) => new THREE.MeshStandardMaterial({ color: c, roughness: r, metalness: m });
const hover = [];
function add(g, mesh, info) { mesh.castShadow = mesh.receiveShadow = true; if (info) mesh.userData.info = info; g.add(mesh); hover.push(mesh); return mesh; }
function box(g, w, h, d, col, x, y, z, info, r = 0.5) {
  const geo = (r > 0 && Math.min(w, h, d) > 0.8) ? new RoundedBoxGeometry(w, h, d, 2, Math.min(r, h / 2.2, w / 3, d / 3)) : new THREE.BoxGeometry(w, h, d);
  const m = add(g, new THREE.Mesh(geo, (col.isMaterial || Array.isArray(col)) ? col : M(col)), info); m.position.set(x, y, z); return m;
}
function cyl(g, r, h, col, x, y, z, info, seg = 24) { const m = add(g, new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, seg), col.isMaterial ? col : M(col)), info); m.position.set(x, y, z); return m; }
const pcbEdge = M(0xcaa94a, 0.5, 0.25);
const pcbMats = c => [pcbEdge, pcbEdge, M(c, 0.55), M(c, 0.7), pcbEdge, pcbEdge];
// iç koordinat -> dünya: X = x - L/2, Y = z, Z = y - W/2
const wc = (x, y, z) => P3(x - L / 2, z, y - W / 2);
const partG = {};
function part(p) {
  const [x0, y0, z0, dx, dy, dz] = p.b; const g = new THREE.Group(); g.position.copy(wc(x0 + dx / 2, y0 + dy / 2, z0 + dz / 2)); scene.add(g);
  g.userData = { zc: z0 + dz / 2, grp: p.grp }; partG[p.key] = g; return g;
}
const info = p => ({ t: p.name, d: p.info + (p.src === "v" ? "" : p.src === "m" ? "  [ÖLÇ]" : "  [tahmin]") });

// ---------------------------------------------------------------- parçalar (ayrıntılı çizimler AABB içinde kalır)
for (const p of BOXES) {
  const [x0, y0, z0, dx, dy, dz] = p.b; const g = part(p); const I = info(p);
  switch (p.key) {
    case "coil": { box(g, dx, 1.4, dy, 0x1a140e, 0, -dz / 2 + 0.7, 0, I, 1);
      for (let i = 0; i < 5; i++) { const t = new THREE.Mesh(new THREE.TorusGeometry(16 - i * 1.4, 0.5, 8, 48), M(0xb9742f, 0.4, 0.85)); t.rotation.x = Math.PI / 2; t.position.set(0, 0.6, 0); t.scale.set(1.45, 1.0, 0.85); g.add(t); } break; }
    case "rc522": { box(g, dx, 1.6, dy, pcbMats(0x1746b8), 0, -dz / 2 + 0.8, 0, I, 0.8);
      const sh = new THREE.Shape(); const rr = (s, w, h, r) => { s.moveTo(-w/2+r,-h/2); s.lineTo(w/2-r,-h/2); s.quadraticCurveTo(w/2,-h/2,w/2,-h/2+r); s.lineTo(w/2,h/2-r); s.quadraticCurveTo(w/2,h/2,w/2-r,h/2); s.lineTo(-w/2+r,h/2); s.quadraticCurveTo(-w/2,h/2,-w/2,h/2-r); s.lineTo(-w/2,-h/2+r); s.quadraticCurveTo(-w/2,-h/2,-w/2+r,-h/2); };
      rr(sh, 50, 30, 5); const hole = new THREE.Path(); rr(hole, 43, 23, 4); sh.holes.push(hole);
      const loop = new THREE.Mesh(new THREE.ExtrudeGeometry(sh, { depth: 0.35, bevelEnabled: false }), M(0xb9742f, 0.4, 0.8)); loop.rotation.x = Math.PI / 2; loop.position.set(0, -dz / 2 - 0.02, 0); g.add(loop);
      box(g, 5, 1.1, 5, 0x1c1f26, 15, -dz / 2 + 2.2, 8); box(g, 2.4, 2.5, 20.3, 0x0c0c0e, -26, -dz / 2 + 2.8, 0, { t: "RC522 8 pin", d: "SDA SCK MOSI MISO IRQ GND RST 3.3V — ince kablo ile M1'e" }, 0.3); break; }
    case "m1": case "m2": { const m = box(g, dx, dz, dy, pcbMats(0x9c7b3c), 0, 0, 0, I, 0.6);
      const n = Math.floor(dx / 2.54), q = Math.floor(dy / 2.54); const dots = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.4, 0.4, 0.05, 6), M(0xe6c76a, 0.4, 0.8), n * q); let i = 0; const mt = new THREE.Matrix4();
      for (let a = 0; a < n; a++) for (let b = 0; b < q; b++) { mt.makeTranslation(-dx / 2 + 1.6 + a * 2.54, dz / 2 + 0.03, -dy / 2 + 1.6 + b * 2.54); dots.setMatrixAt(i++, mt); } g.add(dots); break; }
    case "c6": { // C6: pcb at 2.5 mm above plate (male plastic), WROOM-1 module, USB-C at x=0 end
      const yb = -dz / 2; box(g, 51.8, 1.6, 25.4, pcbMats(0x11602f), 0, yb + 2.5 + 0.8, 0, I, 0.8);
      box(g, 19.5, 2.6, 18, M(0xc4c7cf, 0.35, 0.9), -25.9 + 0.0 + 51.8 - 25.5 + 9.75 - 0.0 - 0, yb + 4.1 + 1.3, 0, { t: "ESP32-C6-WROOM-1", d: "son 6 mm PCB anteni: üstte/yanında metal ve tel yok" });
      box(g, 6, 0.4, 18, 0x0c3f20, 22.9, yb + 4.1 + 0.2, 0, { t: "Anten bölgesi", d: "RDM6300 ve pil buradan uzakta" });
      box(g, 7.3, 3.4, 8.9, M(0xb7bbc4, 0.3, 0.95), -25.9 + 3.65 - 1, yb + 4.1 + 1.7, 0, { t: "USB-C", d: "alt duvardaki delikten çıkar" });
      box(g, 2.5, 2.5, 25.4, 0x0c0c0e, 0, yb + 1.25, 0, null, 0.2); break; }
    case "tp": { box(g, 26, 1.6, 17, pcbMats(0x1746b8), 0, -dz / 2 + 0.8, 0, I, 0.8); box(g, 7.5, 3.2, 9, M(0xb7bbc4, 0.3, 0.95), -11.2, -dz / 2 + 1.6 + 1.6, 0, { t: "Type-C şarj girişi", d: "alt duvardaki ikinci delik" }); box(g, 5, 1.2, 5, 0x1c1f26, 2, -dz / 2 + 2.2, 0); break; }
    case "mt": { box(g, 37, 1.6, 17, pcbMats(0x0b1f6b), 0, -dz / 2 + 0.8, 0, I, 0.8); box(g, 10, dz - 2.2, 10, 0x1a1a1a, 8, 0.8, 0, { t: "Bobin / tepe nokta", d: "kaynaklara göre modülü 7–14 mm yüksek yapan parça" }); box(g, 6.5, 4.5, 6.5, 0x1050c0, -12, -dz / 2 + 3.8, 0); break; }
    case "rdm": { box(g, 38.5, 1.6, 19, pcbMats(0x6a0f12), 0, dz / 2 - 0.8, 0, I, 0.8); box(g, 5, 1.2, 5, 0x1c1f26, 0, dz / 2 - 2.2, 0); box(g, 2.4, 4, 12.7, 0x0c0c0e, -16.6, dz / 2 - 3.4, 0, { t: "RDM6300 P1", d: "TX RX NC GND VCC (5V)" }, 0.3); break; }
    case "bat": { box(g, dx, dz, dy, M(0x6f7684, 0.5, 0.2), 0, 0, 0, I, 1.8); box(g, 8, 1.4, 5, 0x2a2a2e, dx / 2 - 5, dz / 2 + 0.7, 0, null, 0.3); break; }
    case "lcd": { // LCD PCB üstte; altı dişi soket (boşluk). Ekran metni uzunluk boyunca okunur.
      const yTop = dz / 2; const pcbY = yTop - 1.6 - 5.0 + 0.0; // PCB üstü = yTop - 5 (joystick yüksekliği)
      const py = dz / 2 - 5.0 - 0.8; box(g, 52, 1.6, 26.5, pcbMats(0x0f1115), 0, py, 0, I, 0.8);
      box(g, 27.5, 1.2, 25, 0x080808, -10, py + 1.4, 0);
      const screenMat = new THREE.MeshStandardMaterial({ roughness: 0.2, emissive: 0xffffff });
      const sc = add(g, new THREE.Mesh(new THREE.PlaneGeometry(23.4, 23.4), screenMat), { t: "Ekran 240×240", d: "Menü (koddan çizildi)" }); sc.rotation.x = -Math.PI / 2; sc.position.set(-10, py + 2.05, 0);
      cyl(g, 3.2, 4.6, M(0x18181c, 0.5), 16, py + 2.5, 5, { t: "Joystick", d: "UP/DOWN/LEFT/RIGHT (konum yaklaşık)" });
      for (const [bx, bz] of [[16, -5], [12, -8], [20, -8], [16, -11]]) cyl(g, 1.9, 2.4, M(0x24262e, 0.5), bx, py + 1.8, bz, null, 16);
      for (const z of [-8.89, 8.89]) { box(g, 20 * 2.54, 8.45, 2.5, 0x101114, 0, -dz / 2 + 2.5 + 4.225, z, { t: "Ekranın dişi soketi", d: "8.45 mm" }, 0.3); box(g, 20 * 2.54, 2.5, 2.4, 0x0c0c0e, 0, -dz / 2 + 1.25, z, { t: "2×20 erkek pin (M2)", d: "sıra aralığı 17.78 mm (Pico standardı, doğrulanamadı)" }, 0.3); }
      const S = 512, cv = document.createElement("canvas"); cv.width = cv.height = S; const c2 = cv.getContext("2d");
